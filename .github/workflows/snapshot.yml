name: Snapshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - AGENTS.md
      - docs/**
  workflow_dispatch:

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-snapshot:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    environment: vadmin
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .mvn/wrapper/maven-wrapper.properties
          # Maven 4 binds server id "central" to repo.maven.apache.org. Reusing it for the
          # Central Portal snapshots host drops these credentials and the deploy returns 401.
          server-id: central-snapshots
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Declare the Central snapshots repository
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path.home() / ".m2" / "settings.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          profiles = root.find("profiles")
          if profiles is None:
              profiles = ET.SubElement(root, "profiles")
          profile = ET.SubElement(profiles, "profile")
          ET.SubElement(profile, "id").text = "central-snapshots"
          repository = ET.SubElement(ET.SubElement(profile, "repositories"), "repository")
          ET.SubElement(repository, "id").text = "central-snapshots"
          ET.SubElement(repository, "url").text = "https://central.sonatype.com/repository/maven-snapshots/"
          ET.SubElement(ET.SubElement(repository, "releases"), "enabled").text = "false"
          ET.SubElement(ET.SubElement(repository, "snapshots"), "enabled").text = "true"
          active = root.find("activeProfiles")
          if active is None:
              active = ET.SubElement(root, "activeProfiles")
          ET.SubElement(active, "activeProfile").text = "central-snapshots"
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          version="$(sed -n 's@^[[:space:]]*<version>\([^<]*\)</version>.*@\1@p' pom.xml | head -n 1)"
          test -n "${version}"
          case "${version}" in
            *-SNAPSHOT)
              echo "Publishing ${version}"
              echo "is_snapshot=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Skipping non-SNAPSHOT version: ${version}"
              echo "is_snapshot=false" >> "${GITHUB_OUTPUT}"
              ;;
          esac

      - name: Publish SNAPSHOT
        if: steps.version.outputs.is_snapshot == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: >
          ./mvnw -B -ntp -DskipTests deploy
          -DaltDeploymentRepository=central-snapshots::https://central.sonatype.com/repository/maven-snapshots/
