name: Prepare next SNAPSHOT

on:
  workflow_run:
    workflows:
      - Publish Release
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: prepare-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open next SNAPSHOT PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve next development version
        id: version
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            release_tag="$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1)"
            if [[ -z "${release_tag}" || "${release_tag}" == *-* ]]; then
              echo "Skipping prerelease or untagged Publish Release run: ${release_tag:-none}"
              echo "should_prepare=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          current_version="$(sed -n 's@^[[:space:]]*<version>\([^<]*\)</version>.*@\1@p' pom.xml | head -n 1)"
          if [[ "${current_version}" == *-SNAPSHOT || "${current_version}" == *-* ]]; then
            echo "Skipping non-stable development source: ${current_version}"
            echo "should_prepare=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${current_version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported release version: ${current_version}" >&2
            exit 1
          fi

          next_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-SNAPSHOT"
          branch="codex/prepare-${next_version//./-}"
          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "next_version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "should_prepare=true" >> "${GITHUB_OUTPUT}"

      - name: Create SNAPSHOT branch and pull request
        if: steps.version.outputs.should_prepare == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail

          if gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq 'length' | grep -q '^1$'; then
            echo "An open SNAPSHOT PR already exists for ${NEXT_VERSION}."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "A SNAPSHOT branch already exists for ${NEXT_VERSION}; refusing to overwrite it."
            exit 0
          fi

          git switch --create "${BRANCH}"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("pom.xml")
          text = path.read_text()
          pattern = re.compile(
              r"(<artifactId>vadmin-parent</artifactId>\s*<version>)([^<]+)(</version>)"
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit("Root vadmin-parent version element was not found")
          current_version = os.environ["CURRENT_VERSION"]
          next_version = os.environ["NEXT_VERSION"]
          if match.group(2) != current_version:
              raise SystemExit(
                  f"Root version {match.group(2)} does not match {current_version}"
              )
          updated = pattern.sub(r"\g<1>" + next_version + r"\3", text, count=1)
          if updated == text:
              raise SystemExit("Root version was not updated")
          path.write_text(updated)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pom.xml
          git diff --cached --name-only | grep -qx 'pom.xml'
          git commit -m "build: prepare ${NEXT_VERSION} development version"
          git push --set-upstream origin "${BRANCH}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH}" \
            --title "build: prepare ${NEXT_VERSION} development version" \
            --body "Prepare the next patch development line after the stable release.\n\nThis pull request was opened by the post-release version workflow. It does not publish a release."
